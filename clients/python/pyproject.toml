[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "catmq"
version = "1.0.0"
description = "A client for the CatMQ message queue's HTTP API."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "NetworkDLS" }]
keywords = ["catmq", "message queue", "queue", "webhooks"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/NTDLS/CatMQ"

[tool.setuptools]
packages = ["catmq"]
